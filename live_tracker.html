<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Live Athlete Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
      color: white;
    }

    /* Card Mappa in Alto a Destra */
    .tracker-card {
      position: absolute;
      top: 40px;
      right: 50px;
      width: 320px;
      background: #09101d;
      border-radius: 18px;
      border: 2px solid rgba(56, 182, 255, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      padding: 18px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tracker-card.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Header Atleta */
    .athlete-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px;
    }

    .athlete-name {
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .athlete-nation {
      background: #38b6ff;
      color: #040d18;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.8px;
    }

    /* Box Mappa Percorso Reale */
    .track-box {
      position: relative;
      width: 100%;
      height: 230px;
      background: #04070f;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    svg.track-svg {
      width: 100%;
      height: 100%;
    }

    /* Linee Rosse Partenza e Arrivo */
    .gate-line {
      stroke: #ff2233;
      stroke-width: 4;
      stroke-linecap: round;
    }

    /* Linea Grigia di Sfondo */
    .path-bg {
      fill: none;
      stroke: #334155;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Linea Verde Neon Percorsa */
    .path-active {
      fill: none;
      stroke: #00ff88;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px #00ff88);
    }

    /* Pallino Rosso Atleta */
    .athlete-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ff2233;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff2233;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    /* PILLOLA CRONOMETRO IN BASSO A DESTRA */
    .bottom-right-chrono {
      position: absolute;
      bottom: 45px;
      right: 50px;
      background: #09101d;
      border-radius: 14px;
      border: 2px solid rgba(56, 182, 255, 0.4);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bottom-right-chrono.active {
      opacity: 1;
      transform: translateY(0);
    }

    .chrono-label {
      font-size: 10px;
      font-weight: 800;
      color: #8a9ba8;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .chrono-time {
      font-size: 32px;
      font-weight: 900;
      color: #00ff88;
      font-family: monospace;
      letter-spacing: -0.5px;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.5);
      line-height: 1;
      margin-top: 2px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, 0.35);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- 1. Mappa del Percorso (In Alto a Destra) -->
  <div class="tracker-card" id="trackerCard">
    <div class="athlete-header">
      <div class="athlete-name" id="athName">MARCO ODERMATT</div>
      <div class="athlete-nation" id="athNat">SUI</div>
    </div>

    <div class="track-box" id="trackBox">
      <svg class="track-svg" viewBox="0 0 200 230" id="svgElem">
        <!-- Linea Partenza -->
        <line x1="80" y1="20" x2="120" y2="20" class="gate-line" />
        
        <!-- Tracciato Reale -->
        <path id="pathBg" class="path-bg" d="
          M 100,20 
          C 60,60 140,90 120,110 
          C 80,130 160,150 140,170 
          C 100,190 70,200 130,205
        " />
        
        <!-- Tracciato Verde Neon Animato -->
        <path id="pathActive" class="path-active" d="
          M 100,20 
          C 60,60 140,90 120,110 
          C 80,130 160,150 140,170 
          C 100,190 70,200 130,205
        " />
        
        <!-- Linea Arrivo -->
        <line x1="110" y1="205" x2="150" y2="205" class="gate-line" />
      </svg>

      <!-- Pallino Atleta -->
      <div class="athlete-dot" id="athDot" style="top: 20px; left: 100px;"></div>
    </div>
  </div>

  <!-- 2. Cronometro Tempo Live (In Basso a Destra) -->
  <div class="bottom-right-chrono" id="chronoWidget">
    <div>
      <div class="chrono-label">TEMPO LIVE</div>
      <div class="chrono-time" id="chronoDisplay">00:00.00</div>
    </div>
    <div class="status-badge" id="statusBadge">IN DISCESA</div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_live_tracker_channel');
    const card = document.getElementById('trackerCard');
    const chronoWidget = document.getElementById('chronoWidget');
    const dot = document.getElementById('athDot');
    const pathBg = document.getElementById('pathBg');
    const pathActive = document.getElementById('pathActive');
    const chronoDisp = document.getElementById('chronoDisplay');
    const statusBd = document.getElementById('statusBadge');
    const trackBox = document.getElementById('trackBox');

    const totalLen = pathBg.getTotalLength();
    pathActive.style.strokeDasharray = totalLen;
    pathActive.style.strokeDashoffset = totalLen;

    let animTimer = null;
    let startTime = 0;

    function updateDotPosition(progress) {
      const currentLen = progress * totalLen;
      const point = pathBg.getPointAtLength(currentLen);

      const rect = trackBox.getBoundingClientRect();
      const scaleX = rect.width / 200;
      const scaleY = rect.height / 230;

      const posX = point.x * scaleX;
      const posY = point.y * scaleY;

      dot.style.left = posX + 'px';
      dot.style.top = posY + 'px';

      pathActive.style.strokeDashoffset = totalLen * (1 - progress);
    }

    channel.onmessage = (event) => {
      const data = event.data;
      if (data.action === 'start') {
        document.getElementById('athName').innerText = data.name || 'MARCO ODERMATT';
        document.getElementById('athNat').innerText = data.nation || 'SUI';
        card.classList.add('active');
        chronoWidget.classList.add('active');
        
        clearInterval(animTimer);
        startTime = Date.now();
        const duration = 55000;

        animTimer = setInterval(() => {
          const elapsed = Date.now() - startTime;
          let progress = elapsed / duration;

          if (progress >= 1) {
            progress = 1;
            clearInterval(animTimer);
            statusBd.innerText = "ARRIVO";
            statusBd.style.color = "#38b6ff";
            statusBd.style.borderColor = "#38b6ff";
            statusBd.style.background = "rgba(56, 182, 255, 0.15)";
          }

          const mins = Math.floor(elapsed / 60000);
          const secs = Math.floor((elapsed % 60000) / 1000);
          const cent = Math.floor((elapsed % 1000) / 10);
          
          // AGGIORNAMENTO DEL TEMPO LIVE MOSTRATO NEL BOX
          chronoDisp.innerText = 
            (mins < 10 ? "0" + mins : mins) + ":" + 
            (secs < 10 ? "0" + secs : secs) + "." + 
            (cent < 10 ? "0" + cent : cent);

          updateDotPosition(progress);

        }, 30);

      } else if (data.action === 'hide') {
        card.classList.remove('active');
        chronoWidget.classList.remove('active');
        clearInterval(animTimer);
      }
    };
  </script>
</body>
</html>
