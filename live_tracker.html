<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Live Athlete Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
      color: white;
    }

    /* Box posizionato esattamente in ALTO A DESTRA come nella TV */
    .tracker-container {
      position: absolute;
      top: 40px;
      right: 50px;
      width: 280px;
      background: linear-gradient(135deg, rgba(8, 20, 36, 0.95) 0%, rgba(3, 10, 20, 0.98) 100%);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      border: 1px solid rgba(56, 182, 255, 0.35);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      padding: 12px 14px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tracker-container.active {
      opacity: 1;
      transform: translateY(0);
    }

    .athlete-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
    }

    .athlete-name {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .athlete-nation {
      background: #38b6ff;
      color: #040d18;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.8px;
    }

    .tracker-body {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Mini Mappa Verticale Stile TV */
    .minimap-box {
      position: relative;
      width: 50px;
      height: 140px;
      background: rgba(2, 6, 12, 0.9);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    svg.minimap-svg {
      width: 100%;
      height: 100%;
      position: absolute;
    }

    .mini-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .mini-track-active {
      fill: none;
      stroke: #00ff88;
      stroke-width: 4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px #00ff88);
    }

    /* Linee Start / Finish sulla minimappa */
    .mini-line {
      position: absolute;
      width: 24px;
      height: 3px;
      background: #ff3344;
      left: 13px;
    }
    .mini-line.start { top: 6px; }
    .mini-line.finish { bottom: 6px; }

    /* Pallino Posizione Atleta */
    .athlete-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff3344;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff3344;
      transform: translate(-50%, -50%);
      transition: top 0.05s linear, left 0.05s linear;
    }

    .chrono-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chrono-label {
      font-size: 8px;
      font-weight: 800;
      color: #8a9ba8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chrono-time {
      font-size: 21px;
      font-weight: 900;
      color: #00ff88;
      font-family: monospace;
      letter-spacing: -1px;
      margin: 2px 0 4px 0;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
    }

    .status-badge {
      font-size: 9px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 4px;
      text-align: center;
      text-transform: uppercase;
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, 0.35);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="tracker-container" id="trackerBox">
    <div class="athlete-header">
      <div class="athlete-name" id="athName">M. ODERMATT</div>
      <div class="athlete-nation" id="athNat">SUI</div>
    </div>

    <div class="tracker-body">
      <!-- Mini Mappa Verticale con Linee Start e Finish -->
      <div class="minimap-box">
        <div class="mini-line start"></div>
        <svg class="minimap-svg" viewBox="0 0 50 140">
          <path class="mini-track" d="M 25,12 C 12,45 38,75 25,105 C 18,118 32,125 25,128" />
          <path class="mini-track-active" id="miniActivePath" d="M 25,12 C 12,45 38,75 25,105 C 18,118 32,125 25,128" />
        </svg>
        <div class="athlete-dot" id="athDot" style="top: 12px; left: 25px;"></div>
        <div class="mini-line finish"></div>
      </div>

      <!-- Cronometro -->
      <div class="chrono-box">
        <div class="chrono-label">TEMPO LIVE</div>
        <div class="chrono-time" id="chronoDisplay">00:00.00</div>
        <div class="status-badge" id="statusBadge">IN DISCESA</div>
      </div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_live_tracker_channel');
    const box = document.getElementById('trackerBox');
    const dot = document.getElementById('athDot');
    const chronoDisp = document.getElementById('chronoDisplay');
    const statusBd = document.getElementById('statusBadge');
    const activePath = document.getElementById('miniActivePath');

    const pathLength = activePath.getTotalLength();
    activePath.style.strokeDasharray = pathLength;
    activePath.style.strokeDashoffset = pathLength;

    let timerInterval = null;
    let startTime = 0;

    function getPointAlongPath(progress) {
      let x, y;
      if (progress <= 0.33) {
        let p = progress / 0.33;
        x = 25 - (p * 13);
        y = 12 + (p * 33);
      } else if (progress <= 0.66) {
        let p = (progress - 0.33) / 0.33;
        x = 12 + (p * 26);
        y = 45 + (p * 30);
      } else {
        let p = (progress - 0.66) / 0.34;
        x = 38 - (p * 13);
        y = 75 + (p * 53);
      }
      return { x, y };
    }

    channel.onmessage = (event) => {
      const data = event.data;
      if (data.action === 'start') {
        document.getElementById('athName').innerText = data.name || 'ATLETA';
        document.getElementById('athNat').innerText = data.nation || 'ITA';
        box.classList.add('active');
        
        clearInterval(timerInterval);
        startTime = Date.now();
        let duration = 55000;
        let currentProg = 0;

        activePath.style.strokeDashoffset = pathLength;

        timerInterval = setInterval(() => {
          let elapsed = Date.now() - startTime;
          currentProg = elapsed / duration;

          if (currentProg >= 1) {
            currentProg = 1;
            clearInterval(timerInterval);
            statusBd.innerText = "ARRIVO";
            statusBd.style.color = "#38b6ff";
            statusBd.style.borderColor = "#38b6ff";
            statusBd.style.background = "rgba(56, 182, 255, 0.15)";
          }

          let mins = Math.floor(elapsed / 60000);
          let secs = Math.floor((elapsed % 60000) / 1000);
          let cent = Math.floor((elapsed % 1000) / 10);
          chronoDisp.innerText = 
            (mins < 10 ? "0" + mins : mins) + ":" + 
            (secs < 10 ? "0" + secs : secs) + "." + 
            (cent < 10 ? "0" + cent : cent);

          activePath.style.strokeDashoffset = pathLength * (1 - currentProg);

          let pt = getPointAlongPath(currentProg);
          dot.style.left = pt.x + 'px';
          dot.style.top = pt.y + 'px';

        }, 30);

      } else if (data.action === 'hide') {
        box.classList.remove('active');
        clearInterval(timerInterval);
      }
    };
  </script>
</body>
</html>
