<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Regia Cronometro Live - Sky Winter Games</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0b1329;
      color: white;
      padding: 30px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #172442;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #38b6ff;
      font-size: 20px;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: #8a9ba8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 10px;
      background: #0b1329;
      border: 1px solid #2d3f66;
      border-radius: 8px;
      color: white;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    button {
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start { background: #00ff88; color: #040d18; }
    .btn-pause { background: #ffd700; color: #040d18; }
    .btn-reset { background: #38b6ff; color: #040d18; }
    .btn-hide  { background: #ff3344; color: white; }
    .btn-full  { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⏱️ CONTROLLO TEMPO LIVE</h1>

    <label>Etichetta Titolo:</label>
    <input type="text" id="timerLabel" value="TEMPO LIVE">

    <div class="btn-grid">
      <button class="btn-start" onclick="sendCmd('start')">▶️ AVVIA (START)</button>
      <button class="btn-pause" onclick="sendCmd('pause')">⏸️ PAUSA</button>
      <button class="btn-reset" onclick="sendCmd('reset')">🔄 RESET (00:00.0)</button>
      <button class="btn-start" onclick="sendCmd('show')">👁️ MOSTRA</button>
      <button class="btn-hide btn-full" onclick="sendCmd('hide')">🚫 NASCONDI DA OBS</button>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_small_timer_channel');

    function sendCmd(action) {
      const title = document.getElementById('timerLabel').value;
      channel.postMessage({ action: action, title: title });
    }
  </script>
</body>
</html>
