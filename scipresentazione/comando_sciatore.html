<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Comando Atleta</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mali:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
      font-family: 'Fredoka', sans-serif;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.97);
      border: 3px solid #38b6ff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(2, 132, 199, 0.2);
    }

    h1 {
      font-family: 'Mali', cursive;
      font-size: 22px;
      color: #0284c7;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }

    input:focus, select:focus {
      border-color: #38b6ff;
      box-shadow: 0 0 10px rgba(56, 182, 255, 0.25);
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 13px;
      border: none;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:active { transform: scale(0.97); }

    .btn-show {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      box-shadow: 0 6px 15px rgba(34, 197, 94, 0.3);
    }

    .btn-hide {
      background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
      color: white;
      box-shadow: 0 6px 15px rgba(225, 29, 72, 0.25);
    }

    .status-box {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 8px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>🎬 Comando Atleta</h1>
    <div class="subtitle">Sky Winter Games • Controllo Grafica Live</div>

    <div class="field">
      <label>🏅 Disciplina</label>
      <select id="inDiscipline" onchange="syncTrackDefault()">
        <option value="alpino">⛷️ Sci Alpino</option>
        <option value="salto">🎿 Salto con gli Sci</option>
      </select>
    </div>

    <div class="field">
      <label>🏔️ Percorso / Modalità</label>
      <select id="inTrack">
        <option value="corto">Percorso Corto 🩵</option>
        <option value="lungo">Percorso Lungo 🌟</option>
        <option value="salto">Salto con gli Sci 🎿</option>
      </select>
    </div>

    <div class="field">
      <label>🔢 Numero Pettorale</label>
      <input type="text" id="inBib" value="01" maxlength="3">
    </div>

    <div class="field">
      <label>✨ Nome Atleta / GamerTag</label>
      <input type="text" id="inName" value="Fery Naly">
    </div>

    <div class="field">
      <label>☁️ Team / Nazione</label>
      <input type="text" id="inTeam" value="Sky Team Italia">
    </div>

    <div class="btns">
      <button class="btn-show" onclick="sendState(true)">▶️ Mostra</button>
      <button class="btn-hide" onclick="sendState(false)">⏹️ Nascondi</button>
    </div>

    <div class="status-box" id="statusBox">Stato: In attesa di comando</div>
  </div>

  <script>
    const STORAGE_KEY = 'skyWinterGames_sciatoreOverlay';

    function syncTrackDefault() {
      const disc = document.getElementById('inDiscipline').value;
      const trackSelect = document.getElementById('inTrack');
      if (disc === 'salto') {
        trackSelect.value = 'salto';
      } else if (trackSelect.value === 'salto') {
        trackSelect.value = 'corto';
      }
    }

    function getFormData(visible) {
      return {
        discipline: document.getElementById('inDiscipline').value,
        track: document.getElementById('inTrack').value,
        bib: (document.getElementById('inBib').value || '01').trim(),
        name: (document.getElementById('inName').value || 'Atleta Sky').trim(),
        team: (document.getElementById('inTeam').value || 'Sky Team').trim(),
        visible: visible,
        updatedAt: Date.now()
      };
    }

    function sendState(visible) {
      const data = getFormData(visible);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      const box = document.getElementById('statusBox');
      if (visible) {
        box.style.background = '#dcfce7';
        box.style.color = '#15803d';
        box.innerText = `🟢 In onda: #${data.bib} ${data.name}`;
      } else {
        box.style.background = '#ffe4e6';
        box.style.color = '#be123c';
        box.innerText = '🔴 Grafica nascosta';
      }
    }
  </script>
</body>
</html>
