<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Live Score Bug Virtual Leaderboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
    }

    .bug-container {
      position: absolute;
      top: 50px;
      left: 60px;
      width: 320px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border-radius: 6px;
      overflow: hidden;
    }

    .bug-container.active {
      opacity: 1;
      transform: translateY(0);
    }

    .bug-container.compact {
      width: 180px;
    }

    .bug-container.compact .name {
      display: none;
    }

    .header-title {
      background: #0d2838;
      color: #38b6ff;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      z-index: 10;
    }

    /* Contenitore Righe per Animazione Posizioni */
    .rows-container {
      position: relative;
      height: 72px; /* Altezza per ospitare due righe da 36px */
      background: #14374e;
    }

    .row-card {
      position: absolute;
      left: 0;
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      box-sizing: border-box;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.4s;
    }

    /* Posizioni Standard */
    .leader-row {
      top: 0;
      background: #14374e;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transform: translateY(0);
      z-index: 1;
    }

    .athlete-row {
      top: 0;
      background: #1b4b6b;
      transform: translateY(36px); /* Parte sotto la riga del leader */
      z-index: 2;
    }

    /* STATO DI SORPASSO (Lo scatto in alto!) */
    .rows-container.overtaken .athlete-row {
      transform: translateY(0); /* Sale in prima posizione */
      background: linear-gradient(90deg, #1b4b6b 0%, #2b6cb0 100%);
      box-shadow: inset 4px 0 0 #ecc94b;
    }

    .rows-container.overtaken .leader-row {
      transform: translateY(36px); /* Il leader scende al secondo posto */
    }

    .country { margin-right: 8px; color: #a0aec0; font-size: 14px; }
    .flag { width: 24px; height: 16px; border-radius: 2px; margin-right: 10px; object-fit: cover; }
    .name { text-transform: uppercase; flex: 1; letter-spacing: 0.5px; white-space: nowrap; }
    .score { font-size: 18px; font-weight: 800; color: #ffffff; }

    .tech-box {
      background: rgba(240, 244, 248, 0.95);
      color: #1a2b3c;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      position: relative;
      z-index: 10;
    }

    .tech-title {
      color: #555;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
    }

    .tech-row {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }

    .tech-value { font-weight: 800; color: #0d2838; }

    .elements-bar {
      display: flex;
      gap: 4px;
      padding: 6px 12px;
      background: #0d2838;
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
      z-index: 10;
    }

    .element-box {
      flex: 1;
      height: 12px;
      border-radius: 2px;
      background: #555555;
      transition: background-color 0.3s ease;
    }

    .element-box.green { background: #38a169; }
    .element-box.red { background: #e53e3e; }
    .element-box.yellow { background: #ecc94b; }
  </style>
</head>
<body>

  <div class="bug-container" id="bug">
    <div class="header-title" id="eventTitle">WOMEN'S FREE SKATING</div>
    
    <div class="rows-container" id="rowsContainer">
      <!-- Leader Row -->
      <div class="row-card leader-row" id="leaderRow">
        <span class="country" id="leaderCountry">SKY</span>
        <img src="https://flagcdn.com/w80/it.png" class="flag" id="leaderFlag">
        <span class="name" id="leaderName">LORY</span>
        <span class="score" id="leaderScore">12.57</span>
      </div>

      <!-- Current Athlete Row -->
      <div class="row-card athlete-row" id="athleteRow">
        <span class="country" id="currentCountry">SKY</span>
        <img src="https://flagcdn.com/w80/jp.png" class="flag" id="currentFlag">
        <span class="name" id="currentName">NALY</span>
        <span class="score" id="currentScore">13.00</span>
      </div>
    </div>

    <!-- Technical Score -->
    <div class="tech-box">
      <div class="tech-title">TECHNICAL SCORE</div>
      <div class="tech-row">
        <span>CURRENT BASE</span>
        <span class="tech-value" id="baseScore">0.00</span>
      </div>
      <div class="tech-row">
        <span>CURRENT GOE</span>
        <span class="tech-value" id="goeScore">+0.00</span>
      </div>
    </div>

    <!-- Quadrati Elementi -->
    <div class="elements-bar">
      <div class="element-box" id="el0"></div>
      <div class="element-box" id="el1"></div>
      <div class="element-box" id="el2"></div>
      <div class="element-box" id="el3"></div>
      <div class="element-box" id="el4"></div>
      <div class="element-box" id="el5"></div>
      <div class="element-box" id="el6"></div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_live_score_channel');

    channel.onmessage = (event) => {
      const data = event.data;
      const bug = document.getElementById('bug');
      const rowsContainer = document.getElementById('rowsContainer');
      const leaderRow = document.getElementById('leaderRow');

      if (data.visible) {
        document.getElementById('eventTitle').innerText = data.eventTitle || "WOMEN'S FREE SKATING";
        
        const currentTotal = parseFloat(data.totalScore || 0);
        const leaderTotal = parseFloat(data.leaderScore || 0);

        if (data.isFirstAthlete) {
          leaderRow.style.display = 'none';
          rowsContainer.classList.remove('overtaken');
        } else {
          leaderRow.style.display = 'flex';
          document.getElementById('leaderCountry').innerText = data.leaderCountry || '';
          document.getElementById('leaderFlag').src = `https://flagcdn.com/w80/${(data.leaderFlag || 'it').toLowerCase()}.png`;
          document.getElementById('leaderName').innerText = data.leaderName || '';
          document.getElementById('leaderScore').innerText = leaderTotal.toFixed(2);

          // VERIFICA SORPASSO AUTOMATICO
          if (currentTotal > leaderTotal) {
            rowsContainer.classList.add('overtaken');
          } else {
            rowsContainer.classList.remove('overtaken');
          }
        }

        document.getElementById('currentCountry').innerText = data.currentCountry || '';
        document.getElementById('currentFlag').src = `https://flagcdn.com/w80/${(data.currentFlag || 'jp').toLowerCase()}.png`;
        document.getElementById('currentName').innerText = data.currentName || '';
        document.getElementById('currentScore').innerText = currentTotal.toFixed(2);
        
        const curBase = parseFloat(data.currentBase || 0);
        const curGoe = parseFloat(data.currentGoe || 0);
        document.getElementById('baseScore').innerText = curBase.toFixed(2);
        document.getElementById('goeScore').innerText = (curGoe >= 0 ? '+' : '') + curGoe.toFixed(2);

        if (data.elementStates && Array.isArray(data.elementStates)) {
          data.elementStates.forEach((state, index) => {
            const box = document.getElementById(`el${index}`);
            if (box) box.className = 'element-box ' + state;
          });
        }

        if (data.isCompact) {
          bug.classList.add('compact');
        } else {
          bug.classList.remove('compact');
        }

        bug.classList.add('active');
      } else {
        bug.classList.remove('active');
      }
    };
  </script>
</body>
</html>
    };
  </script>
</body>
</html>
