<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Live Score Bug Auto ISU</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
    }

    .bug-container {
      position: absolute;
      top: 50px;
      left: 60px;
      width: 320px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border-radius: 6px;
      overflow: hidden;
    }

    .bug-container.active {
      opacity: 1;
      transform: translateY(0);
    }

    .bug-container.compact {
      width: 180px;
    }

    .bug-container.compact .name {
      display: none;
    }

    .header-title {
      background: #0d2838;
      color: #38b6ff;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .leader-row {
      background: #14374e;
      color: white;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      font-size: 15px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .leader-row.hidden {
      display: none;
    }

    .athlete-row {
      background: #1b4b6b;
      color: white;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .country { margin-right: 8px; color: #a0aec0; font-size: 14px; }
    .flag { width: 24px; height: 16px; border-radius: 2px; margin-right: 10px; object-fit: cover; }
    .name { text-transform: uppercase; flex: 1; letter-spacing: 0.5px; white-space: nowrap; }
    .score { font-size: 18px; font-weight: 800; color: #ffffff; }

    .tech-box {
      background: rgba(240, 244, 248, 0.95);
      color: #1a2b3c;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .tech-title {
      color: #555;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 2px;
    }

    .tech-row {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
    }

    .tech-value { font-weight: 800; color: #0d2838; }

    .elements-bar {
      display: flex;
      gap: 4px;
      padding: 6px 12px;
      background: #0d2838;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .element-box {
      flex: 1;
      height: 12px;
      border-radius: 2px;
      background: #555555;
      transition: background-color 0.3s ease;
    }

    .element-box.green { background: #38a169; }
    .element-box.red { background: #e53e3e; }
    .element-box.yellow { background: #ecc94b; }
  </style>
</head>
<body>

  <div class="bug-container" id="bug">
    <div class="header-title" id="eventTitle">WOMEN'S FREE SKATING</div>
    
    <div class="leader-row" id="leaderRow">
      <span class="country" id="leaderCountry">CHN</span>
      <img src="https://flagcdn.com/w80/cn.png" class="flag" id="leaderFlag">
      <span class="name" id="leaderName">ZHANG</span>
      <span class="score" id="leaderScore">61.54</span>
    </div>

    <div class="athlete-row">
      <span class="country" id="currentCountry">ITA</span>
      <img src="https://flagcdn.com/w80/it.png" class="flag" id="currentFlag">
      <span class="name" id="currentName">GUTMANN</span>
      <span class="score" id="currentScore">0.00</span>
    </div>

    <div class="tech-box">
      <div class="tech-title">TECHNICAL SCORE</div>
      <div class="tech-row">
        <span>CURRENT BASE</span>
        <span class="tech-value" id="baseScore">0.00</span>
      </div>
      <div class="tech-row">
        <span>CURRENT GOE</span>
        <span class="tech-value" id="goeScore">+0.00</span>
      </div>
    </div>

    <div class="elements-bar">
      <div class="element-box" id="el0"></div>
      <div class="element-box" id="el1"></div>
      <div class="element-box" id="el2"></div>
      <div class="element-box" id="el3"></div>
      <div class="element-box" id="el4"></div>
      <div class="element-box" id="el5"></div>
      <div class="element-box" id="el6"></div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_live_score_channel');

    channel.onmessage = (event) => {
      const data = event.data;
      const bug = document.getElementById('bug');
      const leaderRow = document.getElementById('leaderRow');

      if (data.visible) {
        document.getElementById('eventTitle').innerText = data.eventTitle || "WOMEN'S FREE SKATING";
        
        if (data.isFirstAthlete) {
          leaderRow.classList.add('hidden');
        } else {
          leaderRow.classList.remove('hidden');
          document.getElementById('leaderCountry').innerText = data.leaderCountry || '';
          document.getElementById('leaderFlag').src = `https://flagcdn.com/w80/${(data.leaderFlag || 'cn').toLowerCase()}.png`;
          document.getElementById('leaderName').innerText = data.leaderName || '';
          document.getElementById('leaderScore').innerText = data.leaderScore || '0.00';
        }

        document.getElementById('currentCountry').innerText = data.currentCountry || '';
        document.getElementById('currentFlag').src = `https://flagcdn.com/w80/${(data.currentFlag || 'it').toLowerCase()}.png`;
        document.getElementById('currentName').innerText = data.currentName || '';

        // Punteggio Totale Cumulativo
        document.getElementById('currentScore').innerText = parseFloat(data.totalScore || 0).toFixed(2);
        
        // Elemento Corrente
        const curBase = parseFloat(data.currentBase || 0);
        const curGoe = parseFloat(data.currentGoe || 0);
        document.getElementById('baseScore').innerText = curBase.toFixed(2);
        document.getElementById('goeScore').innerText = (curGoe >= 0 ? '+' : '') + curGoe.toFixed(2);

        // Aggiornamento Quadrati
        if (data.elementStates && Array.isArray(data.elementStates)) {
          data.elementStates.forEach((state, index) => {
            const box = document.getElementById(`el${index}`);
            if (box) {
              box.className = 'element-box ' + state;
            }
          });
        }

        if (data.isCompact) {
          bug.classList.add('compact');
        } else {
          bug.classList.remove('compact');
        }

        bug.classList.add('active');
      } else {
        bug.classList.remove('active');
      }
    };
  </script>
</body>
</html>
