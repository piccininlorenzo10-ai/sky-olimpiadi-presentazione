<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Regia Sky - Live Score Bug</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121824;
      color: white;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { color: #38b6ff; text-align: center; font-size: 20px; }
    .card { background: #1a202c; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; color: #a0aec0; font-size: 13px; font-weight: bold; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #2d3748;
      background: #0d1117;
      color: white;
      box-sizing: border-box;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-show { background: #38b6ff; color: #000; }
    .btn-hide { background: #e53e3e; color: white; }
    .btn-yellow { background: #ecc94b; color: #000; }
    .btn-green { background: #48bb78; color: white; }
    .elements-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
    .elements-grid select { padding: 4px; font-size: 11px; text-align: center; }
  </style>
</head>
<body>

  <h1>🎛️ Regia Live Score Bug</h1>

  <!-- Leader in Classifica -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">🥇 Leader Attuale (1° Posto)</h3>
    <div class="form-group">
      <label><input type="checkbox" id="isFirstAthlete" onchange="sendLiveScore(true)"> Prima atleta in gara (Nasconde Leader)</label>
    </div>
    <div class="form-group">
      <label>Nazione (es. CHN):</label>
      <input type="text" id="leaderCountry" value="CHN">
    </div>
    <div class="form-group">
      <label>Bandiera ISO (es. cn):</label>
      <input type="text" id="leaderFlag" value="cn">
    </div>
    <div class="form-group">
      <label>Cognome Leader:</label>
      <input type="text" id="leaderName" value="ZHANG">
    </div>
    <div class="form-group">
      <label>Punteggio Leader:</label>
      <input type="number" step="0.01" id="leaderScore" value="61.54">
    </div>
  </div>

  <!-- Atleta in Pista -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">⛸️ Atleta in Pista</h3>
    <div class="form-group">
      <label>Nazione (es. ITA):</label>
      <input type="text" id="currentCountry" value="ITA">
    </div>
    <div class="form-group">
      <label>Bandiera ISO (es. it):</label>
      <input type="text" id="currentFlag" value="it">
    </div>
    <div class="form-group">
      <label>Cognome Atleta:</label>
      <input type="text" id="currentName" value="GUTMANN">
    </div>
    <div class="form-group">
      <label>Base Value (Valore Base):</label>
      <input type="number" step="0.01" id="baseScore" value="10.70" oninput="sendLiveScore(true)">
    </div>
    <div class="form-group">
      <label>Execution (GOE):</label>
      <input type="number" step="0.01" id="goeScore" value="1.18" oninput="sendLiveScore(true)">
    </div>
  </div>

  <!-- Quadrati Elementi -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">🟩 Valutazione Elementi (7 Saliti/Stacchi)</h3>
    <label>Stato Elementi (Grigio, Verde, Rosso, Giallo):</label>
    <div class="elements-grid">
      <select id="el0" onchange="sendLiveScore(true)"><option value="">1</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
      <select id="el1" onchange="sendLiveScore(true)"><option value="">2</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
      <select id="el2" onchange="sendLiveScore(true)"><option value="">3</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
      <select id="el3" onchange="sendLiveScore(true)"><option value="">4</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
      <select id="el4" onchange="sendLiveScore(true)"><option value="">5</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
      <select id="el5" onchange="sendLiveScore(true)"><option value="">6</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
      <select id="el6" onchange="sendLiveScore(true)"><option value="">7</option><option value="green">🟩</option><option value="red">🟥</option><option value="yellow">🟨</option></select>
    </div>
  </div>

  <!-- Controlli Posizione e Visibilità -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">🎬 Controlli Regia</h3>
    <div class="btn-group">
      <button class="btn-yellow" onclick="toggleCompact(true)">⬅️ COMPATTA (Punti a sx)</button>
      <button class="btn-green" onclick="toggleCompact(false)">➡️ ESPANDI (Punti a dx)</button>
    </div>
    <div class="btn-group" style="margin-top: 10px;">
      <button class="btn-show" onclick="sendLiveScore(true)">📺 MOSTRA BUG</button>
      <button class="btn-hide" onclick="sendLiveScore(false)">🚫 NASCONDI BUG</button>
    </div>
  </div>

  <script>
    const liveChannel = new BroadcastChannel('sky_live_score_channel');
    let compactState = false;

    function toggleCompact(compact) {
      compactState = compact;
      sendLiveScore(true);
    }

    function getValueSafely(id, defaultValue) {
      const el = document.getElementById(id);
      return el ? el.value : defaultValue;
    }

    function sendLiveScore(visible) {
      const elementStates = [];
      for (let i = 0; i < 7; i++) {
        elementStates.push(getValueSafely(`el${i}`, ''));
      }

      liveChannel.postMessage({
        visible: visible,
        eventTitle: "WOMEN'S FREE SKATING",
        isFirstAthlete: document.getElementById('isFirstAthlete').checked,
        isCompact: compactState,
        leaderCountry: getValueSafely('leaderCountry', 'CHN'),
        leaderFlag: getValueSafely('leaderFlag', 'cn'),
        leaderName: getValueSafely('leaderName', 'ZHANG'),
        leaderScore: getValueSafely('leaderScore', '61.54'),
        currentCountry: getValueSafely('currentCountry', 'ITA'),
        currentFlag: getValueSafely('currentFlag', 'it'),
        currentName: getValueSafely('currentName', 'GUTMANN'),
        baseScore: getValueSafely('baseScore', 0),
        goeScore: getValueSafely('goeScore', 0),
        elementStates: elementStates
      });
    }
  </script>
</body>
</html>
