<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Regia Sky - Live Score Dinamico (Short 7 / Free 11)</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121824;
      color: white;
      padding: 20px;
      max-width: 650px;
      margin: 0 auto;
    }
    h1 { color: #38b6ff; text-align: center; font-size: 20px; }
    .card { background: #1a202c; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; color: #a0aec0; font-size: 13px; font-weight: bold; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #2d3748;
      background: #0d1117;
      color: white;
      box-sizing: border-box;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-show { background: #38b6ff; color: #000; }
    .btn-hide { background: #e53e3e; color: white; }
    .btn-yellow { background: #ecc94b; color: #000; }
    .btn-green { background: #48bb78; color: white; }

    /* Griglia Elementi */
    .element-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 35px;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .element-row span { font-weight: bold; color: #38b6ff; }
    .status-indicator { font-size: 16px; text-align: center; }
  </style>
</head>
<body>

  <h1>🎛️ Regia Punti (Short 7 / Free 11)</h1>

  <!-- Selezione Programma -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">📋 Segmento di Gara</h3>
    <div class="form-group">
      <label>Seleziona Programma:</label>
      <select id="programType" onchange="onProgramChange()">
        <option value="SHORT">SHORT PROGRAM (7 Elementi)</option>
        <option value="FREE" selected>FREE SKATING (11 Elementi)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Titolo Evento:</label>
      <input type="text" id="eventTitleInput" value="WOMEN'S FREE SKATING" oninput="calcAndSend(true)">
    </div>
  </div>

  <!-- Leader -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">🥇 Leader Attuale</h3>
    <div class="form-group">
      <label><input type="checkbox" id="isFirstAthlete" onchange="calcAndSend(true)"> Prima atleta in gara (Nasconde Leader)</label>
    </div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="leaderCountry" value="CHN" placeholder="Nazione" oninput="calcAndSend(true)">
      <input type="text" id="leaderFlag" value="cn" placeholder="Bandiera" oninput="calcAndSend(true)">
      <input type="text" id="leaderName" value="ZHANG" placeholder="Cognome" oninput="calcAndSend(true)">
      <input type="number" step="0.01" id="leaderScore" value="61.54" placeholder="Punteggio" oninput="calcAndSend(true)">
    </div>
  </div>

  <!-- Atleta Corrente -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;">👤 Atleta in Pista</h3>
    <div style="display:flex; gap:10px;">
      <input type="text" id="currentCountry" value="ITA" placeholder="Nazione" oninput="calcAndSend(true)">
      <input type="text" id="currentFlag" value="it" placeholder="Bandiera" oninput="calcAndSend(true)">
      <input type="text" id="currentName" value="GUTMANN" placeholder="Cognome" oninput="calcAndSend(true)">
    </div>
  </div>

  <!-- Tabella Dinamica Elementi -->
  <div class="card">
    <h3 style="color: #38b6ff; margin-top: 0;" id="elementsHeaderTitle">⛸️ Tabella Elementi Tecnici</h3>
    <p style="font-size:12px; color:#a0aec0; margin-bottom: 12px;">Inserisci Base e GOE. I colori e il totale si aggiornano automaticamente!</p>

    <div id="elementsContainer"></div>

    <div style="margin-top:15px; font-size:16px; font-weight:bold; color:#ecc94b; text-align:right;">
      TOTALE TECNICO CUMULATIVO: <span id="totalDisplay">0.00</span>
    </div>
  </div>

  <!-- Controlli -->
  <div class="card">
    <div class="btn-group">
      <button class="btn-yellow" onclick="toggleCompact(true)">⬅️ COMPATTA</button>
      <button class="btn-green" onclick="toggleCompact(false)">➡️ ESPANDI</button>
    </div>
    <div class="btn-group" style="margin-top: 10px;">
      <button class="btn-show" onclick="calcAndSend(true)">📺 MOSTRA BUG</button>
      <button class="btn-hide" onclick="calcAndSend(false)">🚫 NASCONDI BUG</button>
    </div>
  </div>

  <script>
    const liveChannel = new BroadcastChannel('sky_live_score_channel');
    let compactState = false;

    function getMaxElements() {
      const type = document.getElementById('programType').value;
      return type === 'SHORT' ? 7 : 11;
    }

    function onProgramChange() {
      const type = document.getElementById('programType').value;
      const titleInput = document.getElementById('eventTitleInput');
      
      if (type === 'SHORT') {
        titleInput.value = "WOMEN'S SHORT PROGRAM";
        document.getElementById('elementsHeaderTitle').innerText = "⛸️ Tabella Elementi (7 per Short)";
      } else {
        titleInput.value = "WOMEN'S FREE SKATING";
        document.getElementById('elementsHeaderTitle').innerText = "⛸️ Tabella Elementi (11 per Free)";
      }

      buildElementsInputs();
      calcAndSend(true);
    }

    function buildElementsInputs() {
      const container = document.getElementById('elementsContainer');
      container.innerHTML = '';
      const max = getMaxElements();

      for (let i = 0; i < max; i++) {
        container.innerHTML += `
          <div class="element-row">
            <span>#${i+1}</span>
            <input type="number" step="0.01" id="base_${i}" placeholder="Base" oninput="calcAndSend(true)">
            <input type="number" step="0.01" id="goe_${i}" placeholder="GOE" oninput="calcAndSend(true)">
            <span class="status-indicator" id="status_${i}">⬛</span>
          </div>
        `;
      }
    }

    function toggleCompact(compact) {
      compactState = compact;
      calcAndSend(true);
    }

    function calcAndSend(visible) {
      const max = getMaxElements();
      let totalScore = 0;
      let elementStates = [];
      let currentBase = 0;
      let currentGoe = 0;

      for (let i = 0; i < max; i++) {
        const baseVal = document.getElementById(`base_${i}`).value;
        const goeVal = document.getElementById(`goe_${i}`).value;

        const base = parseFloat(baseVal);
        const goe = parseFloat(goeVal);
        const statusEl = document.getElementById(`status_${i}`);

        if (!isNaN(base)) {
          const validGoe = isNaN(goe) ? 0 : goe;
          totalScore += (base + validGoe);

          currentBase = base;
          currentGoe = validGoe;

          if (isNaN(goe)) {
            elementStates.push('yellow');
            statusEl.innerText = '🟨';
          } else if (goe > 0) {
            elementStates.push('green');
            statusEl.innerText = '🟩';
          } else if (goe < 0) {
            elementStates.push('red');
            statusEl.innerText = '🟥';
          } else {
            elementStates.push('yellow');
            statusEl.innerText = '🟨';
          }
        } else {
          elementStates.push('');
          statusEl.innerText = '⬛';
        }
      }

      document.getElementById('totalDisplay').innerText = totalScore.toFixed(2);

      liveChannel.postMessage({
        visible: visible,
        eventTitle: document.getElementById('eventTitleInput').value || "WOMEN'S SKATING",
        isFirstAthlete: document.getElementById('isFirstAthlete').checked,
        isCompact: compactState,
        leaderCountry: document.getElementById('leaderCountry').value,
        leaderFlag: document.getElementById('leaderFlag').value,
        leaderName: document.getElementById('leaderName').value,
        leaderScore: document.getElementById('leaderScore').value,
        currentCountry: document.getElementById('currentCountry').value,
        currentFlag: document.getElementById('currentFlag').value,
        currentName: document.getElementById('currentName').value,
        totalScore: totalScore,
        currentBase: currentBase,
        currentGoe: currentGoe,
        elementStates: elementStates
      });
    }

    // Inizializzazione all'avvio (Default Free con 11 elementi)
    buildElementsInputs();
  </script>
</body>
</html>
