<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Modulo & Pass Iscrizione</title>
  <!-- Libreria per il download dell'immagine del pass -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
      font-family: 'Fredoka', sans-serif;
      color: #1e3a8a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .sky-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 4px solid #7dd3fc;
      border-radius: 35px;
      box-shadow: 0 15px 35px rgba(125, 211, 252, 0.35);
      width: 100%;
      max-width: 580px;
      padding: 35px 30px;
      position: relative;
    }

    .sky-card::before {
      content: '🎀';
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 38px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .sky-bar {
      height: 6px;
      width: 100px;
      margin: 0 auto 12px auto;
      border-radius: 10px;
      background: linear-gradient(90deg, #38b6ff 0%, #a5f3fc 50%, #818cf8 100%);
    }

    .pill-tag {
      display: inline-block;
      background: #bae6fd;
      color: #0369a1;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 20px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Mali', cursive;
      font-size: 28px;
      color: #0284c7;
      text-shadow: 2px 2px 0px #ffffff;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 14px 18px;
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      color: #0f172a;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #38b6ff;
      box-shadow: 0 0 12px rgba(56, 182, 255, 0.5);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #38b6ff 0%, #7dd3fc 100%);
      border: none;
      border-radius: 25px;
      color: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(56, 182, 255, 0.4);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 25px rgba(56, 182, 255, 0.6);
    }

    .confirmation-view {
      display: none;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .accepted-badge {
      text-align: center;
      background: #dcfce7;
      border: 2px dashed #22c55e;
      color: #15803d;
      padding: 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .athlete-pass {
      background: #ffffff;
      border-radius: 25px;
      padding: 22px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .pass-pattinaggio { border: 3px solid #7dd3fc; background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%); }
    .pass-pattinaggio .pass-header-tag { background: #38b6ff; color: white; }

    .pass-sci-corto { border: 3px solid #fde047; background: linear-gradient(180deg, #fefce8 0%, #ffffff 100%); }
    .pass-sci-corto .pass-header-tag { background: #eab308; color: white; }

    .pass-sci-lungo { border: 3px solid #818cf8; background: linear-gradient(180deg, #e0e7ff 0%, #ffffff 100%); }
    .pass-sci-lungo .pass-header-tag { background: #4f46e5; color: white; }

    .pass-header-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .pass-title {
      font-family: 'Mali', cursive;
      font-size: 22px;
      color: #0369a1;
      margin-bottom: 12px;
    }

    .pass-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 12px;
      border-radius: 15px;
      border: 1px solid #e2e8f0;
      margin-bottom: 15px;
    }

    .info-item { font-size: 12px; color: #64748b; }
    .info-item b { font-size: 14px; color: #0f172a; display: block; }

    .pass-instructions {
      background: #f8fafc;
      border-left: 4px solid #38b6ff;
      padding: 12px;
      border-radius: 0 12px 12px 0;
      font-size: 12px;
      color: #334155;
      line-height: 1.5;
    }

    .pass-instructions ul { margin-left: 18px; margin-top: 6px; }
    .pass-footer { text-align: center; margin-top: 15px; font-size: 11px; color: #94a3b8; font-weight: 700; }
  </style>
</head>
<body>

  <div class="sky-card">
    <div id="formSection">
      <div class="header">
        <div class="sky-bar"></div>
        <div class="pill-tag">❄️ Sky Winter Games 2026 ❄️</div>
        <h1>Modulo Iscrizione ✨</h1>
      </div>

      <form id="regForm">
        <div class="form-group">
          <label for="athleteName">🩵 Nome Atleta / GamerTag</label>
          <input type="text" id="athleteName" placeholder="Es. Alex_Skater" required>
        </div>

        <div class="form-group">
          <label for="teamName">☁️ Nazione / Team / Club</label>
          <input type="text" id="teamName" placeholder="Es. Italia / Sky Team" required>
        </div>

        <div class="form-group">
          <label for="discipline">⭐ Seleziona Disciplina</label>
          <select id="discipline" required onchange="handleDisciplineChange()">
            <option value="Pattinaggio">⛸️ Pattinaggio di Figura</option>
            <option value="Sci">⛷️ Sci Alpino</option>
          </select>
        </div>

        <div class="form-group" id="sciOptions" style="display: none;">
          <label for="sciTrack">🎿 Selezione Percorso Sci</label>
          <select id="sciTrack">
            <option value="Corto">Percorso Corto 🩵</option>
            <option value="Lungo">Percorso Lungo 🌟</option>
            <option value="Entrambi">Entrambi i Percorsi (Corto + Lungo) ✨</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Conferma Iscrizione Sky ✨</button>
      </form>
    </div>

    <!-- SCHERMATA ACCETTAZIONE E DOWNLOAD -->
    <div class="confirmation-view" id="confirmationSection">
      <div class="accepted-badge">
        🎉 ISCRIZIONE ACCETTATA E CONFERMATA! 🎉
      </div>

      <div id="passContainer"></div>

      <!-- Pulsante Download -->
      <div style="text-align: center; margin-top: 20px;">
        <button onclick="downloadPass()" style="background: linear-gradient(135deg, #38b6ff 0%, #a5f3fc 100%); border: none; padding: 14px 28px; border-radius: 25px; color: #0369a1; font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(56,182,255,0.4); transition: all 0.2s ease;">📥 Scarica il tuo Pass Atleta PNG</button>
      </div>
    </div>
  </div>

  <script>
    let isRegistrationOpen = true;
    const channel = new BroadcastChannel('sky_registration_channel');

    // Ascolta la chiusura/apertura dalla regia
    channel.onmessage = (e) => {
      if (!e.data) return;
      if (e.data.type === 'STATUS_CHANGE') {
        isRegistrationOpen = e.data.isOpen;
        updateFormStatus();
      }
    };

    function updateFormStatus() {
      const submitBtn = document.querySelector('.btn-submit');
      const formSection = document.getElementById('formSection');

      if (!isRegistrationOpen) {
        submitBtn.disabled = true;
        submitBtn.style.background = '#cbd5e1';
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.innerText = '🔒 Iscrizioni Chiuse dalla Regia';

        if (!document.getElementById('closedNotice')) {
          const notice = document.createElement('div');
          notice.id = 'closedNotice';
          notice.style.cssText = 'background: #ffe4e6; border: 2px dashed #fb7185; color: #be123c; padding: 12px; border-radius: 18px; text-align: center; margin-bottom: 15px; font-weight: 700; font-size: 13px;';
          notice.innerText = '❌ Le iscrizioni per gli Sky Winter Games sono attualmente chiuse!';
          formSection.insertBefore(notice, document.getElementById('regForm'));
        }
      } else {
        submitBtn.disabled = false;
        submitBtn.style.background = 'linear-gradient(135deg, #38b6ff 0%, #7dd3fc 100%)';
        submitBtn.style.cursor = 'pointer';
        submitBtn.innerText = 'Conferma Iscrizione Sky ✨';

        const notice = document.getElementById('closedNotice');
        if (notice) notice.remove();
      }
    }

    function handleDisciplineChange() {
      const disc = document.getElementById('discipline').value;
      document.getElementById('sciOptions').style.display = (disc === 'Sci') ? 'block' : 'none';
    }

    document.getElementById('regForm').addEventListener('submit', (e) => {
      e.preventDefault();

      if (!isRegistrationOpen) {
        alert("Spiacenti, le iscrizioni sono chiuse dalla regia!");
        return;
      }

      const name = document.getElementById('athleteName').value;
      const team = document.getElementById('teamName').value;
      const disc = document.getElementById('discipline').value;
      const track = document.getElementById('sciTrack').value;

      document.getElementById('formSection').style.display = 'none';
      document.getElementById('confirmationSection').style.display = 'block';

      const passBox = document.getElementById('passContainer');
      let categoryType = "";

      if (disc === 'Pattinaggio') {
        categoryType = "PATTINAGGIO";
        passBox.innerHTML = `
          <div class="athlete-pass pass-pattinaggio">
            <span class="pass-header-tag">0 Official Pass • Pattinaggio</span>
            <div class="pass-title">Pass Atleta: Short + Free Program</div>
            <div class="pass-info-grid">
              <div class="info-item">Atleta: <b>${name}</b></div>
              <div class="info-item">Team: <b>${team}</b></div>
              <div class="info-item">Programmi: <b>Short & Free</b></div>
              <div class="info-item">Codice Pass: <b>SKY-PAT-${Math.floor(1000 + Math.random() * 9000)}</b></div>
            </div>
            <div class="pass-instructions">
              <b>📌 Guida & Regolamento Gara:</b>
              <ul>
                <li>Sei iscritto sia allo <b>Short Program</b> che al <b>Free Program</b>.</li>
                <li>Punteggio calcolato su Elementi Tecnici (TES) + Componenti (PCS).</li>
                <li>Presentati in regia 10 minuti prima per la prova audio/musica.</li>
              </ul>
            </div>
            <div class="pass-footer">Sky Winter Games 2026 • Pass Ufficiale Sky Sport</div>
          </div>
        `;
      } else if (disc === 'Sci' && track === 'Corto') {
        categoryType = "SCI_CORTO";
        passBox.innerHTML = `
          <div class="athlete-pass pass-sci-corto">
            <span class="pass-header-tag">⛷️ Official Pass • Sci Corto</span>
            <div class="pass-title">Pass Atleta: Percorso Corto</div>
            <div class="pass-info-grid">
              <div class="info-item">Atleta: <b>${name}</b></div>
              <div class="info-item">Team: <b>${team}</b></div>
              <div class="info-item">Tracciato: <b>Sprint Track</b></div>
              <div class="info-item">Codice Pass: <b>SKY-SC-${Math.floor(1000 + Math.random() * 9000)}</b></div>
            </div>
            <div class="pass-instructions">
              <b>📌 Guida & Regolamento Gara:</b>
              <ul>
                <li>Tracciato veloce con curve strette e reattive.</li>
                <li>Obiettivo: minor tempo complessivo.</li>
                <li>Penalità: +2 secondi per ogni porta saltata.</li>
              </ul>
            </div>
            <div class="pass-footer">Sky Winter Games 2026 • Pass Ufficiale Sky Sport</div>
          </div>
        `;
      } else {
        categoryType = (track === 'Entrambi') ? 'SCI_ENTRAMBI' : 'SCI_LUNGO';
        const isDouble = (track === 'Entrambi') ? "Doppio Percorso (Corto + Lungo)" : "Percorso Lungo";
        passBox.innerHTML = `
          <div class="athlete-pass pass-sci-lungo">
            <span class="pass-header-tag">🏔️ Official Pass • Sci Lungo</span>
            <div class="pass-title">Pass Atleta: ${isDouble}</div>
            <div class="pass-info-grid">
              <div class="info-item">Atleta: <b>${name}</b></div>
              <div class="info-item">Team: <b>${team}</b></div>
              <div class="info-item">Modalità: <b>${isDouble}</b></div>
              <div class="info-item">Codice Pass: <b>SKY-SL-${Math.floor(1000 + Math.random() * 9000)}</b></div>
            </div>
            <div class="pass-instructions">
              <b>📌 Guida & Regolamento Gara:</b>
              <ul>
                <li>Tracciato lungo ad alta velocità con salto panoramico.</li>
                <li>Gestisci la traiettoria per mantenere la massima velocità.</li>
                ${track === 'Entrambi' ? '<li><b>Nota:</b> Partecipi anche alla classifica Combinata!</li>' : ''}
              </ul>
            </div>
            <div class="pass-footer">Sky Winter Games 2026 • Pass Ufficiale Sky Sport</div>
          </div>
        `;
      }

      channel.postMessage({
        type: 'NEW_REGISTRATION',
        name: name,
        team: team,
        discipline: disc,
        categoryType: categoryType,
        timestamp: new Date().toLocaleTimeString()
      });
    });

    function downloadPass() {
      const passElement = document.getElementById('passContainer');
      html2canvas(passElement, { scale: 2, backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'SkyWinterGames_PassAtleta.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
