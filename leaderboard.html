<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Classifica</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
    }

    .leaderboard-wrapper {
      position: absolute;
      bottom: 70px;
      left: 90px;
      width: 1300px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      background: rgba(8, 22, 36, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .leaderboard-wrapper.active {
      opacity: 1;
      transform: translateY(0);
    }

    .header {
      background: linear-gradient(90deg, #071726 0%, #004b87 100%);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #38b6ff;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .tag-discipline {
      background: #38b6ff;
      color: #05101a;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .title-main {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .header-right {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .col-titles {
      display: flex;
      align-items: center;
      padding: 12px 30px;
      background: rgba(3, 11, 18, 0.85);
      color: #7f9cb5;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .col-rank { width: 50px; text-align: center; }
    .col-athlete { flex: 1; padding-left: 20px; }
    .col-short { width: 190px; text-align: right; }
    .col-free { width: 190px; text-align: right; }
    .col-total { width: 170px; text-align: right; color: #38b6ff; }

    .rows-container { display: flex; flex-direction: column; }

    .row-item {
      display: flex;
      align-items: center;
      padding: 11px 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: #ffffff;
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.4s ease;
    }

    .leaderboard-wrapper.active .row-item {
      opacity: 1;
      transform: translateX(0);
    }

    .row-item:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

    .rank-num {
      width: 34px;
      height: 34px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .row-item:nth-child(1) .rank-num { background: #ecc94b; color: #05101a; }
    .row-item:nth-child(2) .rank-num { background: #cbd5e0; color: #05101a; }
    .row-item:nth-child(3) .rank-num { background: #ed8936; color: #05101a; }

    .country-code {
      font-size: 15px;
      font-weight: 700;
      color: #7f9cb5;
      margin-left: 20px;
      width: 42px;
    }

    .flag-icon {
      width: 30px;
      height: 20px;
      border-radius: 3px;
      object-fit: cover;
      margin-right: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    .athlete-name {
      font-size: 19px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex: 1;
    }

    .score-num { font-size: 19px; font-weight: 700; color: #e2e8f0; }
    .total-num { font-size: 21px; font-weight: 900; color: #38b6ff; }
  </style>
</head>
<body>

  <div class="leaderboard-wrapper" id="board">
    <div class="header">
      <div class="header-left">
        <span class="tag-discipline">FIGURE SKATING</span>
        <span class="title-main" id="titleText">WOMEN'S SINGLE SKATING</span>
      </div>
      <div class="header-right">SKY WINTER GAMES ™</div>
    </div>

    <div class="col-titles">
      <div class="col-rank">POS</div>
      <div class="col-athlete">ATHLETE</div>
      <div class="col-short">SHORT PROGRAM</div>
      <div class="col-free">FREE SKATING</div>
      <div class="col-total">TOTAL</div>
    </div>

    <div class="rows-container" id="rowsList"></div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_leaderboard_channel');

    channel.onmessage = (event) => {
      const data = event.data;
      const board = document.getElementById('board');
      const rowsList = document.getElementById('rowsList');

      if (data.visible) {
        document.getElementById('titleText').innerText = data.title || "WOMEN'S SINGLE SKATING";
        rowsList.innerHTML = '';

        if (data.skaters && Array.isArray(data.skaters)) {
          data.skaters.forEach((skater, index) => {
            const item = document.createElement('div');
            item.className = 'row-item';
            item.style.transitionDelay = `${index * 0.08}s`;

            item.innerHTML = `
              <div class="col-rank"><div class="rank-num">${index + 1}</div></div>
              <div class="col-athlete" style="display:flex; align-items:center;">
                <span class="country-code">${skater.country || ''}</span>
                <img src="https://flagcdn.com/w80/${(skater.flag || 'it').toLowerCase()}.png" class="flag-icon">
                <span class="athlete-name">${skater.name || ''}</span>
              </div>
              <div class="col-short">
                <span class="score-num">${skater.shortScore || '-'}</span>
              </div>
              <div class="col-free">
                <span class="score-num">${skater.freeScore || '-'}</span>
              </div>
              <div class="col-total"><span class="total-num">${skater.totalScore || '0.00'}</span></div>
            `;
            rowsList.appendChild(item);
          });
        }

        board.classList.add('active');
      } else {
        board.classList.remove('active');
      }
    };
  </script>
</body>
</html>
