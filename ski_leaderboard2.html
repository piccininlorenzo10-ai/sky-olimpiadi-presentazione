<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Classifica Finale Grande</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
      color: white;
    }

    /* Schermata Grande a Schermo Intero / Centrata */
    .leaderboard-fullscreen {
      position: absolute;
      top: 80px;
      left: 160px;
      width: 1600px;
      height: 920px;
      background: linear-gradient(135deg, rgba(6, 16, 28, 0.97) 0%, rgba(2, 8, 16, 0.99) 100%);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 2px solid rgba(56, 182, 255, 0.4);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
      padding: 40px 50px;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .leaderboard-fullscreen.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Header Grande Stile TV */
    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-badge {
      display: inline-block;
      background: #38b6ff;
      color: #040d18;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 2px;
      width: fit-content;
    }

    .lb-title {
      font-size: 34px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .sky-brand {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .sky-brand span { color: #38b6ff; }

    /* Griglia della Classifica */
    .lb-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      background: rgba(15, 28, 48, 0.85);
      border-radius: 12px;
      padding: 14px 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Podio (1°, 2°, 3° Posto) */
    .lb-row.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.25) 0%, rgba(15, 28, 48, 0.9) 100%);
      border: 2px solid #ffd700;
    }

    .lb-row.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.22) 0%, rgba(15, 28, 48, 0.9) 100%);
      border: 1px solid #c0c0c0;
    }

    .lb-row.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.22) 0%, rgba(15, 28, 48, 0.9) 100%);
      border: 1px solid #cd7f32;
    }

    .pos-box {
      width: 50px;
      font-size: 24px;
      font-weight: 900;
      color: #8a9ba8;
    }

    .rank-1 .pos-box { color: #ffd700; }
    .rank-2 .pos-box { color: #c0c0c0; }
    .rank-3 .pos-box { color: #cd7f32; }

    .ath-details {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ath-name {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
    }

    .ath-nat {
      background: rgba(56, 182, 255, 0.15);
      color: #38b6ff;
      border: 1px solid rgba(56, 182, 255, 0.3);
      font-size: 12px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .ath-time {
      font-size: 22px;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      margin-right: 30px;
    }

    .ath-gap {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
      width: 110px;
      text-align: right;
      color: #00ff88;
    }

    .ath-gap.plus { color: #ff3344; }
  </style>
</head>
<body>

  <div class="leaderboard-fullscreen" id="lbContainer">
    <div class="lb-header">
      <div class="header-left">
        <span class="event-badge">CLASSIFICA FINALE OFFICIAL</span>
        <div class="lb-title" id="raceTitle">SKI DOWNHILL - CORTINA 2026</div>
      </div>
      <div class="sky-brand">SKY <span>WINTER GAMES</span></div>
    </div>

    <div class="lb-grid" id="lbGrid">
      <!-- Gli atleti verranno inseriti dinamicamente -->
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_leaderboard_channel');
    const container = document.getElementById('lbContainer');
    const grid = document.getElementById('lbGrid');

    function renderGrid(athletes) {
      grid.innerHTML = '';
      athletes.forEach((ath, idx) => {
        const rank = idx + 1;
        const row = document.createElement('div');
        row.className = `lb-row rank-${rank <= 3 ? rank : 'other'}`;

        row.innerHTML = `
          <div class="pos-box">${rank}</div>
          <div class="ath-details">
            <span class="ath-name">${ath.name}</span>
            <span class="ath-nat">${ath.nation}</span>
          </div>
          <div class="ath-time">${ath.time}</div>
          <div class="ath-gap ${ath.diff.startsWith('+') ? 'plus' : ''}">${ath.diff}</div>
        `;
        grid.appendChild(row);
      });
    }

    channel.onmessage = (event) => {
      const data = event.data;
      if (data.action === 'show') {
        if (data.title) document.getElementById('raceTitle').innerText = data.title;
        if (data.athletes) renderGrid(data.athletes);
        container.classList.add('active');
      } else if (data.action === 'update') {
        if (data.athletes) renderGrid(data.athletes);
      } else if (data.action === 'hide') {
        container.classList.remove('active');
      }
    };
  </script>
</body>
</html>
