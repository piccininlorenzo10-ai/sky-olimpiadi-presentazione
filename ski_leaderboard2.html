<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sky Winter Games - Ski Leaderboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
      color: white;
    }

    /* Contenitore Grafica Classifica (Centrato / Sinistra) */
    .leaderboard-card {
      position: absolute;
      top: 100px;
      left: 70px;
      width: 520px;
      background: linear-gradient(135deg, rgba(8, 20, 36, 0.96) 0%, rgba(3, 10, 20, 0.98) 100%);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(56, 182, 255, 0.35);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
      padding: 24px;
      opacity: 0;
      transform: translateX(-50px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .leaderboard-card.active {
      opacity: 1;
      transform: translateX(0);
    }

    /* Header */
    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .lb-title {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .sky-badge {
      background: #38b6ff;
      color: #040d18;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Tabella Atleti */
    .lb-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      background: rgba(15, 28, 48, 0.8);
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }

    .lb-row.rank-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.2) 0%, rgba(15, 28, 48, 0.8) 100%);
      border-left: 4px solid #ffd700;
    }

    .lb-row.rank-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.18) 0%, rgba(15, 28, 48, 0.8) 100%);
      border-left: 4px solid #c0c0c0;
    }

    .lb-row.rank-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.18) 0%, rgba(15, 28, 48, 0.8) 100%);
      border-left: 4px solid #cd7f32;
    }

    .pos-num {
      font-size: 16px;
      font-weight: 900;
      width: 28px;
      color: #8a9ba8;
    }

    .rank-1 .pos-num { color: #ffd700; }
    .rank-2 .pos-num { color: #c0c0c0; }
    .rank-3 .pos-num { color: #cd7f32; }

    .ath-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ath-name {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
    }

    .ath-nation {
      background: rgba(255, 255, 255, 0.1);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      color: #38b6ff;
    }

    .ath-time {
      font-size: 16px;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
    }

    .ath-diff {
      font-size: 13px;
      font-weight: 800;
      font-family: monospace;
      width: 65px;
      text-align: right;
      color: #00ff88;
    }

    .ath-diff.plus { color: #ff3344; }
  </style>
</head>
<body>

  <div class="leaderboard-card" id="lbCard">
    <div class="lb-header">
      <div class="lb-title" id="lbRaceTitle">CLASSIFICA FIS DOWNHILL</div>
      <div class="sky-badge">LIVE</div>
    </div>

    <div class="lb-list" id="lbList">
      <!-- Atleti inseriti dinamicamente -->
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('sky_leaderboard_channel');
    const card = document.getElementById('lbCard');
    const listElem = document.getElementById('lbList');

    function renderLeaderboard(athletes) {
      listElem.innerHTML = '';
      athletes.forEach((ath, idx) => {
        const rank = idx + 1;
        const row = document.createElement('div');
        row.className = `lb-row rank-${rank <= 3 ? rank : 'other'}`;

        row.innerHTML = `
          <div class="pos-num">${rank}</div>
          <div class="ath-info">
            <span class="ath-name">${ath.name}</span>
            <span class="ath-nation">${ath.nation}</span>
          </div>
          <div class="ath-time">${ath.time}</div>
          <div class="ath-diff ${ath.diff.startsWith('+') ? 'plus' : ''}">${ath.diff}</div>
        `;
        listElem.appendChild(row);
      });
    }

    channel.onmessage = (event) => {
      const data = event.data;
      if (data.action === 'show') {
        if (data.title) document.getElementById('lbRaceTitle').innerText = data.title;
        if (data.athletes) renderLeaderboard(data.athletes);
        card.classList.add('active');
      } else if (data.action === 'update') {
        if (data.athletes) renderLeaderboard(data.athletes);
      } else if (data.action === 'hide') {
        card.classList.remove('active');
      }
    };
  </script>
</body>
</html>
